syntax = "proto3";

package auth;

service AuthService {
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
}

message RegisterRequest {
  string name = 1;
  string email = 2;
  string password = 3;
}

message RegisterResponse {
  string handle = 1;
  string email = 2;
  string tag = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  int32 id = 2;
  string name = 3;
  string tag = 4;
  string handle = 5;
  string email = 6;
  string status = 7;
  string avatar = 8;
}