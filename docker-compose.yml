version: '3.8'

services:
  db:
    restart: always
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-groupsapp}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    restart: always
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data: